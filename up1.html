<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Protocolo Reconexão em Casal | Sofia Villar</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    :root {
      --bg: #100e13;
      --surface: #17131a;
      --surface-soft: #241524;
      --ink: #f5edf2;
      --muted: #b9aeb8;
      --line: rgba(244, 184, 221, .18);
      --red: #f04c9a;
      --red-dark: #d93686;
      --teal: #f04c9a;
      --teal-soft: rgba(240, 76, 154, .13);
      --gold: #ff856f;
      --green: #22c55e;
      --shadow: 0 20px 70px rgba(0, 0, 0, .42);
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      width: 100%;
      max-width: 100%;
      margin: 0;
      background: #100e13;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.45;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 92% 8%, rgba(109, 32, 93, .22), transparent 28rem),
        radial-gradient(circle at 10% 35%, rgba(240, 76, 154, .1), transparent 24rem),
        #100e13;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      opacity: .035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.3'/%3E%3C/svg%3E");
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .page {
      width: min(760px, calc(100% - 28px));
      min-height: 100vh;
      margin: 0 auto;
      padding: 24px 0 34px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 0;
      align-items: start;
      align-content: start;
      min-width: 0;
    }

    .conversion-hero {
      padding: 22px 24px 20px;
      text-align: left;
      border-radius: 16px 16px 0 0;
      border: 1px solid rgba(240, 76, 154, .24);
      background:
        radial-gradient(circle at 84% 15%, rgba(240, 76, 154, .18), transparent 18rem),
        linear-gradient(100deg, rgba(16, 14, 19, .98), rgba(45, 18, 39, .74));
      box-shadow: 0 18px 60px rgba(0, 0, 0, .28);
      min-width: 0;
    }

    .confirmation-topline {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 12px;
      border: 1px solid rgba(183, 246, 207, .3);
      border-radius: 999px;
      color: #d9fdd3;
      background: rgba(37, 211, 102, .14);
      font-size: .8rem;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .confirmation-check {
      display: grid;
      width: 18px;
      height: 18px;
      place-items: center;
      border-radius: 50%;
      color: #075e54;
      background: #d9fdd3;
      font-size: .75rem;
      font-weight: 900;
    }

    h1 {
      margin: 10px 0 0;
      color: #f5edf2;
      font-size: clamp(1.85rem, 4.2vw, 3.2rem);
      line-height: 1.05;
      letter-spacing: -0.01em;
      max-width: 22ch;
    }

    .danger-highlight {
      color: #f04c9a;
    }

    .hero-copy {
      max-width: 38rem;
      margin: 10px 0 0;
      color: #d5c8d2;
      font-size: 0.96rem;
      line-height: 1.45;
      overflow-wrap: break-word;
    }

    .hero-copy strong {
      display: block;
      color: #f4d6e8;
      font-weight: 600;
    }

    .chat-shell {
      min-height: min(650px, calc(100vh - 210px));
      border: 1px solid rgba(240, 76, 154, .28);
      border-top: 0;
      border-radius: 0 0 16px 16px;
      background: #17131a;
      box-shadow: 0 20px 80px rgba(0, 0, 0, .45), 0 0 60px rgba(240, 76, 154, .08);
      overflow: hidden;
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-width: 0;
    }

    .chat-header {
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: center;
      border-bottom: 1px solid rgba(244, 184, 221, .18);
      background: #141117;
      color: #fff;
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .avatar {
      width: 44px;
      height: 44px;
      flex: 0 0 auto;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid rgba(240, 76, 154, .6);
      background: var(--surface-soft);
      box-shadow: 0 0 0 1px rgba(0, 0, 0, .2), 0 4px 14px rgba(240, 76, 154, .25);
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
      display: block;
    }

    .profile h2 {
      margin: 0;
      color: #f5edf2;
      font-size: 1.02rem;
      line-height: 1.15;
      font-weight: 700;
    }

    .profile p {
      margin: 3px 0 0;
      color: #b9aeb8;
      font-size: 0.8rem;
    }

    .status-pill {
      min-width: max-content;
      padding: 6px 11px;
      border-radius: 999px;
      background: rgba(240, 76, 154, .14);
      color: #fce7f3;
      font-size: 0.76rem;
      font-weight: 800;
      border: 1px solid rgba(240, 76, 154, .25);
    }

    .progress {
      height: 3px;
      background: rgba(244, 184, 221, .12);
    }

    .progress-bar {
      width: 12%;
      height: 100%;
      background: linear-gradient(90deg, #f04c9a, #ff856f);
      transition: width 320ms ease;
    }

    .messages {
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 22px 18px 28px;
      background:
        radial-gradient(circle at 75% 0%, rgba(109, 32, 93, .18), transparent 22rem),
        #100e13;
    }

    .row {
      display: flex;
      gap: 10px;
      margin: 0 0 12px;
      align-items: flex-end;
      min-width: 0;
      animation: rise 220ms ease-out;
    }

    .row.user {
      justify-content: flex-end;
    }

    .mini-avatar {
      width: 28px;
      height: 28px;
      flex: 0 0 auto;
      border-radius: 50%;
      overflow: hidden;
      border: 1px solid rgba(240, 76, 154, .5);
      background: var(--surface-soft);
    }

    .mini-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
      display: block;
    }

    .bubble {
      max-width: min(570px, 86%);
      padding: 12px 15px;
      border-radius: 16px 16px 16px 5px;
      background: #211624;
      color: #f5edf2;
      font-size: 0.95rem;
      line-height: 1.45;
      white-space: pre-line;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .24);
      border: 1px solid rgba(244, 184, 221, .1);
    }

    .bubble.user {
      max-width: min(520px, 88%);
      border-radius: 16px 16px 5px 16px;
      background: #6d205d;
      color: #fff7fb;
      border-color: rgba(240, 76, 154, .3);
    }

    .bubble.image-card {
      width: min(520px, 92%);
      max-width: min(520px, 92%);
      padding: 8px;
      overflow: hidden;
      background: #17131a;
      border: 1px solid rgba(240, 76, 154, .35);
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .4);
    }

    .bubble.image-card img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 10px;
    }

    .bubble.offer {
      width: min(540px, 92%);
      max-width: min(540px, 92%);
      padding: 0;
      overflow: hidden;
      background: #141117;
      border: 1px solid rgba(240, 76, 154, .35);
      box-shadow: 0 12px 36px rgba(0, 0, 0, .45);
      border-radius: 14px;
    }

    .offer-head {
      padding: 18px 18px 16px;
      background: linear-gradient(135deg, rgba(109, 32, 93, .5), rgba(240, 76, 154, .14));
      border-bottom: 1px solid rgba(244, 184, 221, .18);
    }

    .offer-head strong {
      display: block;
      font-size: 1.15rem;
      color: #f5edf2;
      letter-spacing: -0.01em;
    }

    .offer-head span {
      display: block;
      margin-top: 4px;
      color: #d5c8d2;
      font-size: 0.92rem;
    }

    .offer-body {
      padding: 16px 18px 18px;
      background: #17131a;
    }

    .stack {
      display: grid;
      gap: 11px;
      margin: 0 0 16px;
      padding: 0;
      list-style: none;
    }

    .stack li {
      display: grid;
      grid-template-columns: 24px 1fr;
      gap: 10px;
      align-items: start;
      color: #d5c8d2;
      font-size: 0.92rem;
      line-height: 1.4;
    }

    .stack li strong {
      color: #f5edf2;
    }

    .check {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #fff;
      background: #f04c9a;
      font-size: 0.78rem;
      font-weight: 900;
      flex-shrink: 0;
    }

    .price {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 6px 10px;
      padding-top: 14px;
      border-top: 1px solid rgba(244, 184, 221, .18);
    }

    .price-installments {
      flex-basis: 100%;
      margin-bottom: 3px;
      color: #ffffff;
      font-size: 1.05rem;
      font-weight: 700;
    }

    .price-installments .installments-amount {
      color: #25d366;
      font-size: 1.25rem;
      font-weight: 900;
    }

    .price del {
      order: 3;
      margin-left: auto;
      align-self: flex-start;
      color: #ff6b6b;
      font-size: 0.88rem;
      font-weight: 600;
    }

    .price strong {
      order: 1;
      color: #25d366;
      font-size: 1.95rem;
      line-height: 1;
      font-weight: 900;
    }

    .price small {
      order: 2;
      color: #b9aeb8;
      font-size: 0.85rem;
    }

    .video-caption {
      margin: 12px 0 0;
      color: #b9aeb8;
      font-size: 0.82rem;
      line-height: 1.35;
      text-align: center;
    }

    .typing {
      width: 58px;
      padding: 11px 12px;
      display: inline-flex;
      gap: 4px;
      border-radius: 14px 14px 14px 5px;
      background: #211624;
      border: 1px solid rgba(244, 184, 221, .1);
    }

    .typing span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #e994c5;
      opacity: 0.65;
      animation: blink 960ms infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: 120ms;
    }

    .typing span:nth-child(3) {
      animation-delay: 240ms;
    }

    .composer {
      border-top: 1px solid rgba(244, 184, 221, .18);
      background: #141117;
      padding: 16px 18px;
    }

    .choices {
      display: grid;
      gap: 10px;
    }

    .choice {
      width: 100%;
      min-height: 48px;
      padding: 12px 16px;
      border: 1px solid rgba(240, 76, 154, .28);
      border-radius: 10px;
      background: #17131a;
      color: #f5edf2;
      font-weight: 600;
      font-size: 0.95rem;
      text-align: left;
      box-shadow: 0 2px 6px rgba(0, 0, 0, .2);
      transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
    }

    .choice:hover,
    .choice:focus-visible {
      border-color: #f04c9a;
      background: #241524;
      outline: 0;
      transform: translateY(-1px);
    }

    .choice.primary {
      border-color: #25d366;
      background: linear-gradient(100deg, #0f7a45, #25d366);
      color: #fff;
      font-weight: 850;
      text-align: center;
      box-shadow: 0 4px 14px rgba(37, 211, 102, .25);
    }

    .choice.primary:hover,
    .choice.primary:focus-visible {
      border-color: #5ff08a;
      background: linear-gradient(100deg, #129650, #3ee47a);
    }

    .checkout-slot {
      margin-top: 12px;
      padding: 14px;
      border: 1px dashed rgba(240, 76, 154, .35);
      border-radius: var(--radius);
      background: #100e13;
      display: grid;
      gap: 8px;
      justify-items: center;
    }

    .slot-label {
      display: block;
      margin-bottom: 10px;
      color: #b9aeb8;
      font-size: 0.8rem;
      text-align: center;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .payt-btn {
      display: block !important;
      width: 100% !important;
      max-width: 380px !important;
      margin: 0 auto !important;
      background: linear-gradient(100deg, #16a34a, #22c55e) !important;
      color: #ffffff !important;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif !important;
      font-size: 16px !important;
      font-weight: 850 !important;
      padding: 15px 18px !important;
      border-radius: 10px !important;
      text-decoration: none !important;
      text-align: center !important;
      cursor: pointer !important;
      box-shadow: 0 6px 20px rgba(34, 197, 94, .32) !important;
      transition: transform 160ms ease, box-shadow 160ms ease !important;
      letter-spacing: 0.02em !important;
      line-height: 1.2 !important;
    }

    .payt-btn:hover {
      transform: translateY(-1px) !important;
      box-shadow: 0 8px 24px rgba(34, 197, 94, .45) !important;
    }

    .payt-select {
      display: none;
      margin: 10px auto 0;
      width: 100%;
      max-width: 280px;
      padding: 10px 12px;
      border: 1px solid rgba(240, 76, 154, .3);
      border-radius: 8px;
      background: #17131a;
      color: #f5edf2;
      font-size: 14px;
      font-weight: 600;
      outline: none;
    }

    .inline-decline-wrap {
      margin-top: 14px;
      text-align: center;
    }

    .inline-decline {
      display: inline-block;
      background: transparent;
      color: #b9aeb8;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 14px;
      border: 0;
      text-align: center;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 3px;
      transition: color 140ms ease;
    }

    .inline-decline:hover,
    .inline-decline:focus-visible {
      color: #f5edf2;
      outline: 0;
    }

    .inline-decline[disabled] {
      opacity: .45;
      cursor: default;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes blink {
      0%, 80%, 100% {
        transform: translateY(0);
        opacity: 0.38;
      }
      40% {
        transform: translateY(-3px);
        opacity: 0.9;
      }
    }

    @media (max-width: 560px) {
      .page {
        width: 100vw;
        max-width: 100vw;
        min-height: 100vh;
        padding: 0;
        overflow: hidden;
      }

      .conversion-hero {
        padding: 18px 16px 16px;
        border-radius: 0;
        border-left: 0;
        border-right: 0;
        border-top: 0;
      }

      h1 {
        font-size: clamp(1.7rem, 8.5vw, 2.35rem);
        max-width: 15ch;
      }

      .hero-copy {
        font-size: 0.92rem;
      }

      .chat-shell {
        min-height: calc(100dvh - 200px);
        border: 0;
        border-radius: 0;
      }

      .status-pill {
        display: none;
      }

      .messages {
        min-height: 260px;
        padding: 16px 12px 20px;
      }

      .bubble {
        max-width: min(84vw, 340px);
        font-size: 0.92rem;
      }

      .bubble.user {
        max-width: min(86vw, 340px);
      }

      .bubble.offer,
      .bubble.image-card {
        width: min(90vw, 350px);
        max-width: min(90vw, 350px);
      }

      .composer {
        padding: 10px 12px calc(12px + env(safe-area-inset-bottom));
      }

      .choice {
        min-height: 46px;
        padding: 11px 13px;
        font-size: 0.93rem;
      }

      .payt-btn {
        font-size: 15px !important;
        padding: 14px 14px !important;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="conversion-hero" aria-label="Confirmação de compra e recomendação opcional">
      <div class="confirmation-topline">
        <span class="confirmation-check">✓</span>
        <span>Compra e acesso confirmados</span>
      </div>
      <h1>Sua compra e seu acesso <span class="danger-highlight">já estão confirmados!</span></h1>
      <p class="hero-copy"><strong>Antes de entrar, quero te mostrar uma recomendação opcional que pode complementar sua experiência.</strong></p>
    </section>

    <section class="chat-shell" aria-label="Conversa com Sofia Villar">
      <div>
        <header class="chat-header">
          <div class="profile">
            <div class="avatar" aria-hidden="true">
              <img src="/up1-sofia.webp" alt="Sofia Villar">
            </div>
            <div>
              <h2>Sofia Villar</h2>
              <p>on-line · guia do Protocolo Reconexão</p>
            </div>
          </div>
          <div class="status-pill">Acesso confirmado</div>
        </header>
        <div class="progress" aria-hidden="true">
          <div id="progressBar" class="progress-bar"></div>
        </div>
      </div>

      <div id="messages" class="messages" aria-live="polite" aria-atomic="false"></div>

      <footer class="composer">
        <div id="choices" class="choices" aria-label="Opções de resposta"></div>
      </footer>
    </section>

    <!--
      O bloco de 1 clique da Payt fica declarado aqui, oculto, desde o
      carregamento da pagina — nao e criado por innerHTML dentro do chat. O
      script da Payt varre o DOM procurando [payt_action] e [payt_element] ao
      rodar, entao os elementos precisam ja existir nesse momento;
      mountPaytCheckout() apenas MOVE o bloco (nao clona) para dentro do balao
      do chat, preservando o que a Payt tenha ligado neles.
    -->
    <div id="payt-oneclick" hidden>
      <a href="#" payt_action="oneclick_buy" data-object="47XX2P-45WZJG" class="payt-btn">SIM, QUERO GARANTIR MEU PLANO!</a>
      <select payt_element="installment" data-object="47XX2P-45WZJG" class="payt-select"></select>
    </div>
  </main>

  <script>
    // Quem recusa o Protocolo cai no downsell (/down1), nao direto no acesso.
    const DECLINE_URL = "/down1";
    const avatarSrc = "/up1-sofia.webp";

    const messagesEl = document.querySelector("#messages");
    const choicesEl = document.querySelector("#choices");
    const progressBar = document.querySelector("#progressBar");

    const state = {
      answers: {},
      progress: 10
    };

    const flow = {
      etapa1: {
        progress: 15,
        bot: [
          "Pronto, minha linda: sua compra e seu acesso ao Mapa já estão confirmados ✅",
          "Antes de você entrar, uma recomendação opcional que vai complementar sua experiência.",
          "O Mapa do Prazer Masculino te deu a técnica…Só que a técnica sozinha não resolve a parte mais difícil: criar o momento e propor sem que pareça cobrança.",
          "Me diz uma coisa: hoje, o que mais trava na hora de colocar em prática?"
        ],
        choices: [
          { text: "Achar a hora certa de propor.", value: "A", next: "etapa2" },
          { text: "Falar sobre isso sem que o clima pese.", value: "B", next: "etapa2" },
          { text: "A rotina, a gente nem tenta mais.", value: "C", next: "etapa2" }
        ],
        store: "etapa1_choice"
      },
      etapa2: {
        progress: 35,
        bot: [
          () => {
            if (state.answers.etapa1_choice === "B") {
              return 'Você quer as palavras certas: para guiar ele na hora, e também para as noites em que ele chega dizendo "hoje não, amor".';
            }
            if (state.answers.etapa1_choice === "C") {
              return "Você quer tirar vocês dois do piloto automático, mesmo nos dias em que o cansaço fala mais alto.";
            }
            return "Você quer saber a hora certa de convidar, com leveza, sem forçar e sem deixar esfriar.";
          },
          "E é justamente aí que quase toda mulher trava.",
          "Não é falta de vontade nem de técnica: em dez anos acompanhando casais, eu vi que o inimigo nunca é você nem é ele, mas sim a rotina que come a energia dos dois, o cansaço e aquele medo silencioso de ser sempre a única que busca.",
          "Foi por isso que eu criei o Protocolo Reconexão em Casal: um plano guiado de 14 dias que cuida exatamente dessa parte."
        ],
        choices: [
          { text: "Quero saber como funciona", primary: true, next: "etapa3" }
        ]
      },
      etapa3: {
        progress: 55,
        bot: [
          "É um material educativo, para maiores de 18 anos. O conteúdo completo fica numa área de membros privada, e você recebe o acesso junto com o Mapa.",
          "Deixa eu te mostrar a lógica do plano.",
          "É um passo curto por dia, na ordem. E cada dia tem três versões: 3, 7 ou 15 minutos e você adapta de acordo com o seu dia.",
          "Os primeiros dias só reabrem o clima. Gestos pequenos, fora da cama, para a noite não começar fria.",
          "O convite vem depois, quando já existe clima para ele, e com as palavras prontas, no seu jeito doce ou divertido.",
          { type: "image", src: "/up1-protocolo-app.webp", alt: "Protocolo Reconexão em Casal — Área de Membros" },

        store: "etapa3_choice"

      etapa4: {

    function sleep(ms) {
      return new Promise(resolve => window.setTimeout(resolve, ms));
    }

    function resolveText(item) {
      return typeof item === "function" ? item() : item;
    }

    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function setProgress(value) {
      state.progress = value;
      progressBar.style.width = `${value}%`;
    }

    function avatarNode() {
      const avatar = document.createElement("div");
      avatar.className = "mini-avatar";
      avatar.innerHTML = `<img src="${avatarSrc}" alt="Sofia">`;
      return avatar;
    }

    function addMessage(text, sender = "bot") {
      const row = document.createElement("div");
      row.className = `row ${sender}`;

      const bubble = document.createElement("div");
      bubble.className = `bubble ${sender === "user" ? "user" : ""}`;
      bubble.textContent = text;

      if (sender === "bot") row.appendChild(avatarNode());
      row.appendChild(bubble);
      messagesEl.appendChild(row);
      scrollToBottom();
    }

    function addImageMessage(src, alt = "") {
      const row = document.createElement("div");
      row.className = "row";
      row.appendChild(avatarNode());

      const card = document.createElement("div");
      card.className = "bubble image-card";
      card.innerHTML = `<img src="${src}" alt="${alt}" loading="eager">`;

      row.appendChild(card);
      messagesEl.appendChild(row);
      scrollToBottom();
    }

    function addOfferCard() {
      const row = document.createElement("div");
      row.className = "row";
      row.appendChild(avatarNode());

      const card = document.createElement("div");
      card.className = "bubble offer";
      card.innerHTML = `
        <div class="offer-head">
          <strong>Protocolo Reconexão em Casal</strong>
          <span>O Plano Guiado de 14 Dias.</span>
        </div>
        <div class="offer-body">
          <ul class="stack">
            <li><span class="check">1</span><span><strong>Semana 1:</strong> Guia "De colegas de quarto a Amantes" — gestos diários para reabrir o clima sem frieza.</span></li>
            <li><span class="check">2</span><span><strong>Semana 2:</strong> O Convite — propor e viver o encontro com leveza, sem peso de cobrança.</span></li>
            <li><span class="check">3</span><span><strong>Os 3 Roteiros de Conversa Sem Vergonha:</strong> Convite Brincalhão, Guia na Cama e Amparo Amoroso.</span></li>
            <li><span class="check">🎁</span><span><strong>Bônus 1 (Incluso):</strong> Áudios de Bolso de 2 Minutos para soltar a ansiedade antes de entrar no quarto (R$97).</span></li>
            <li><span class="check">🎁</span><span><strong>Bônus 2 (Incluso):</strong> O Efeito Ímã — Como Despertar a Iniciativa Dele nos dias seguintes (R$147).</span></li>
            <li><span class="check">✓</span><span><strong>Garantia incondicional de 7 dias:</strong> risco zero para você testar.</span></li>
          </ul>
          <div class="price">
            <span class="price-installments">12x de <span class="installments-amount">R$12,25</span></span>
            <strong>R$147</strong>
            <small>à vista</small>
            <del>R$397</del>
          </div>
          <p class="video-caption">Acesso imediato · Pagamento único · Garantia incondicional de 7 dias</p>
        </div>
      `;

      row.appendChild(card);
      messagesEl.appendChild(row);
      scrollToBottom();
    }

    function mountPaytCheckout(step) {
      const widget = document.getElementById("payt-oneclick");
      if (!widget) return;

      messagesEl.querySelectorAll(".row.checkout-row").forEach(old => old.remove());

      const row = document.createElement("div");
      row.className = "row checkout-row";
      row.appendChild(avatarNode());

      const card = document.createElement("div");
      card.className = "bubble offer";
      card.innerHTML = `
        <div class="offer-body">
          <span class="slot-label">Confirme sua compra em 1 clique</span>
          <div class="checkout-slot"></div>
          <div class="inline-decline-wrap"></div>
        </div>
      `;

      const slot = card.querySelector(".checkout-slot");
      widget.hidden = false;
      slot.appendChild(widget);
      blockEmptyAnchorJump(widget);

      const declineWrap = card.querySelector(".inline-decline-wrap");
      (step.choices || []).forEach(choice => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "inline-decline";
        button.textContent = choice.text;
        button.addEventListener("click", () => choose(choice, step));
        declineWrap.appendChild(button);
      });

      row.appendChild(card);
      messagesEl.appendChild(row);
      watchInstallments(widget);
      scrollToBottom();
    }

    function blockEmptyAnchorJump(widget) {
      const anchor = widget.querySelector("[payt_action]");
      if (!anchor || anchor.dataset.noJump) return;
      anchor.dataset.noJump = "1";
      anchor.addEventListener("click", e => {
        if ((anchor.getAttribute("href") || "") === "#") {
          // Se nao ha token anterior, impede salto para o topo
          if (!window.location.search.includes("_o")) {
            e.preventDefault();
          }
        }
      });
    }

    function watchInstallments(widget) {
      const select = widget.querySelector("[payt_element='installment']");
      if (!select) return;
      const sync = () => { select.style.display = select.options.length ? "block" : "none"; };
      sync();
      new MutationObserver(sync).observe(select, { childList: true });
    }

    function addTyping() {
      const row = document.createElement("div");
      row.className = "row";
      row.dataset.typing = "true";
      row.appendChild(avatarNode());

      const typing = document.createElement("div");
      typing.className = "typing";
      typing.setAttribute("aria-label", "Sofia está digitando");
      typing.innerHTML = "<span></span><span></span><span></span>";
      row.appendChild(typing);
      messagesEl.appendChild(row);
      scrollToBottom();
      return row;
    }

    function calcDelay(text) {
      // Média de ~3 segundos para mensagens normais e ~5 segundos para mensagens mais longas
      const len = text.length;
      if (len <= 70) {
        return 2800 + Math.min(len * 6, 400); // 2.8s a 3.2s (média 3s)
      } else if (len <= 150) {
        return 3200 + Math.round((len - 70) * 12); // 3.2s a 4.1s
      } else {
        return Math.min(4200 + Math.round((len - 150) * 8), 5400); // 4.2s a 5.4s (média ~5s)
      }
    }

    async function botSpeak(lines) {
      for (const item of lines) {
        if (typeof item === "object" && item.type === "image") {
          const typing = addTyping();
          await sleep(3000); // ~3s de digitação antes do card de imagem
          typing.remove();
          addImageMessage(item.src, item.alt || "");
          await sleep(350);
          continue;
        }
        const text = resolveText(item);
        const typing = addTyping();
        await sleep(calcDelay(text));
        typing.remove();
        addMessage(text);
        await sleep(300);
      }
    }

    function renderChoices(step) {
      choicesEl.innerHTML = "";
      step.choices.forEach(choice => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `choice ${choice.primary ? "primary" : ""} ${choice.secondary ? "secondary" : ""}`;
        button.textContent = choice.text;
        button.addEventListener("click", () => choose(choice, step));
        choicesEl.appendChild(button);
      });
    }

    async function choose(choice, step) {
      choicesEl.innerHTML = "";
      messagesEl.querySelectorAll(".inline-decline").forEach(b => { b.disabled = true; });
      addMessage(choice.text, "user");

      if (step.store) {
        state.answers[step.store] = choice.value;
      }

      if (choice.action === "decline") {
        window.location.href = DECLINE_URL;
        return;
      }

      await sleep(500);
      goTo(choice.next);
    }

    async function goTo(id) {
      const step = flow[id];
      setProgress(step.progress);
      await botSpeak(step.bot || []);
      if (step.offer) addOfferCard();
      if (step.checkout) {
        choicesEl.innerHTML = "";
        mountPaytCheckout(step);
      } else {
        await sleep(400);
        renderChoices(step);
      }
    }

    goTo("etapa1");
  </script>

  <script type="text/javascript" src="https://checkout.payt.com.br/multiple-oneclickbuyscript/45GX73.js"></script>
