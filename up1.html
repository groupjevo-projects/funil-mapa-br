    function sleep(ms) {
      return new Promise(resolve => window.setTimeout(resolve, ms));
    }

    function resolveText(item) {
      return typeof item === "function" ? item() : item;
    }

    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function setProgress(value) {
      state.progress = value;
      progressBar.style.width = `${value}%`;
    }

    function avatarNode() {
      const avatar = document.createElement("div");
      avatar.className = "mini-avatar";
      avatar.innerHTML = `<img src="${avatarSrc}" alt="">`;
      return avatar;
    }

    function addMessage(text, sender = "bot") {
      const row = document.createElement("div");
      row.className = `row ${sender}`;

      const bubble = document.createElement("div");
      bubble.className = `bubble ${sender === "user" ? "user" : ""}`;
      bubble.textContent = text;

      if (sender === "bot") row.appendChild(avatarNode());
      row.appendChild(bubble);
      messagesEl.appendChild(row);
      scrollToBottom();
    }

    function addOfferCard() {
      const row = document.createElement("div");
      row.className = "row";
      row.appendChild(avatarNode());

      const card = document.createElement("div");
      card.className = "bubble offer";
      card.innerHTML = `
        <div class="offer-head">
          <strong>Pompoarismo das Deusas</strong>
          <span>A etapa que completa o Mapa quando as mãos saem de cena.</span>
        </div>
        <div class="offer-body">
          <ul class="stack">
            <li><span class="check">✓</span><span>25 técnicas práticas de contração, relaxamento, respiração e ritmo.</span></li>
            <li><span class="check">✓</span><span>Demonstrações passo a passo para aplicar sem improvisar.</span></li>
            <li><span class="check">✓</span><span>Controle Duplo: movimento por fora + consciência por dentro.</span></li>
            <li><span class="check">✓</span><span>Mapa visual com 15 posições e acesso junto ao Mapa.</span></li>
            <li><span class="check">✓</span><span>7 dias de garantia incondicional.</span></li>
          </ul>
          <div class="price">
            <del>R$297</del>
            <strong>R$147</strong>
            <small>à vista ou até 12x no cartão</small>
          </div>
        </div>
      `;

      row.appendChild(card);
      messagesEl.appendChild(row);
      scrollToBottom();
    }

    function mountPaytCheckout(step) {
      const widget = document.getElementById("payt-oneclick");
      if (!widget) return;

      messagesEl.querySelectorAll(".row.checkout-row").forEach(old => {
        if (old.contains(widget)) {
          document.body.appendChild(widget);
          widget.hidden = true;
        }
        old.remove();
      });

      const row = document.createElement("div");
      row.className = "row checkout-row";
      row.appendChild(avatarNode());

      const slot = document.createElement("div");
      slot.className = "bubble offer";
      slot.innerHTML = `
        <div class="offer-body">
          <span class="slot-label">Escolha como deseja continuar</span>
          <div class="payt-slot"></div>
          <div class="inline-decline-wrap"></div>
        </div>
      `;

      const paytSlot = slot.querySelector(".payt-slot");
      widget.hidden = false;
      paytSlot.appendChild(widget);
      blockEmptyAnchorJump(widget);

      const declineWrap = slot.querySelector(".inline-decline-wrap");
      (step.choices || []).forEach(choice => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "decline-link";
        button.textContent = choice.text;
        button.addEventListener("click", () => choose(choice, step));
        declineWrap.appendChild(button);
      });

      row.appendChild(slot);
      messagesEl.appendChild(row);
      watchInstallments(widget);
      scrollToBottom();
    }

    function blockEmptyAnchorJump(widget) {
      const anchor = widget.querySelector("[payt_action]");
      if (!anchor || anchor.dataset.noJump) return;
      anchor.dataset.noJump = "1";
      anchor.addEventListener("click", e => {
        if ((anchor.getAttribute("href") || "") === "#") {
          if (!window.location.search.includes("_o")) {
            e.preventDefault();
          }
        }
      });
    }

    function watchInstallments(widget) {
      const select = widget.querySelector("[payt_element='installment']");
      if (!select) return;
      const sync = () => { select.style.display = select.options.length ? "block" : "none"; };
      sync();
      new MutationObserver(sync).observe(select, { childList: true });
    }

    function loadVturbPlayer() {
      if (document.querySelector(`script[data-vturb-player="${VTURB_PLAYER_ID}"]`)) return;
      const script = document.createElement("script");
      script.type = "text/javascript";
      script.src = VTURB_PLAYER_SCRIPT;
      script.async = true;
      script.dataset.vturbPlayer = VTURB_PLAYER_ID;
      document.head.appendChild(script);
    }

    function addVturbVideo() {
      loadVturbPlayer();

      const row = document.createElement("div");
      row.className = "row";
      row.appendChild(avatarNode());

      const card = document.createElement("div");
      card.className = "demo-video-card";
      card.innerHTML = `
        <div class="offer-head">
          <span class="demo-kicker">Demonstração prática</span>
          <strong>A Envolvente</strong>
          <span>Observe o ritmo: subir, contrair suavemente; descer, relaxar.</span>
        </div>
        <div class="offer-body">
          <div class="vturb-frame"></div>
          <p class="video-caption">Não se trata de se mover mais. Trata-se de saber coordenar.</p>
        </div>
      `;

      const player = document.createElement("vturb-smartplayer");
      player.id = VTURB_PLAYER_ID;
      player.setAttribute("style", "display: block; margin: 0 auto; width: 100%; max-width: 400px;");
      player.innerHTML = '<div class="vturb-player-placeholder"></div>';
      card.querySelector(".vturb-frame").appendChild(player);

      row.appendChild(card);
      messagesEl.appendChild(row);
      scrollToBottom();
    }

    function addTyping() {
      const row = document.createElement("div");
      row.className = "row";
      row.dataset.typing = "true";
      row.appendChild(avatarNode());

      const typing = document.createElement("div");
      typing.className = "typing";
      typing.setAttribute("aria-label", "Sofia está digitando");
      typing.innerHTML = "<span></span><span></span><span></span>";
      row.appendChild(typing);
      messagesEl.appendChild(row);
      scrollToBottom();
      return row;
    }

    async function botSpeak(lines) {
      for (const item of lines) {
        const typing = addTyping();
        await sleep(520 + Math.min(resolveText(item).length * 8, 700));
        typing.remove();
        addMessage(resolveText(item));
        await sleep(180);
      }
    }

    function renderChoices(step) {
      choicesEl.innerHTML = "";
      step.choices.forEach(choice => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `choice ${choice.primary ? "primary" : ""} ${choice.secondary ? "secondary" : ""}`;
        button.textContent = choice.text;
        button.addEventListener("click", () => choose(choice, step));
        choicesEl.appendChild(button);
      });
    }

    async function choose(choice, step) {
      choicesEl.innerHTML = "";
      addMessage(choice.text, "user");

      if (step.store) {
        state.answers[step.store] = choice.value;
      }

      if (choice.action === "thanks") {
        window.location.href = THANK_YOU_URL;
        return;
      }

      if (choice.action === "downsell") {
        window.location.href = DOWNSELL_URL;
        return;
      }

      await sleep(180);
      goTo(choice.next);
    }

    async function goTo(id) {
      const step = flow[id];
      setProgress(step.progress);
      await botSpeak(step.bot || []);
      if (step.video) addVturbVideo();
      if (step.offer) addOfferCard();
      if (step.checkout) {
        choicesEl.innerHTML = "";
        mountPaytCheckout(step);
      } else {
        renderChoices(step);
      }
    }

    goTo("intro");
  </script>
