  <script>
    // ---- Configuracao ----
    // O checkout e o widget de upsell de 1 clique da Kiwify. Nao leva link:
    // a Kiwify reconhece a compra do passo anterior e cobra em um clique. Para
    // onde vai depois fica declarado no proprio <div>: data-upsell-url se aceita,
    // data-downsell-url se recusa.
    // TODO: o id do widget (PENDING-UP1-BR) sai do painel Kiwify da oferta BR.
    // O botao de compra aparece quando o VSL chega no pitch de preco:
    // 6:35 = 395 s. Para revisar o botao sem esperar: abrir com ?preview=1.
    const REVEAL_AT_SECONDS = 395;

    const ctaWrap = document.getElementById("ctaWrap");

    let revealed = false;
    function revealCta() {
      if (revealed) return;
      revealed = true;
      ctaWrap.hidden = false;
      ctaWrap.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    function watchVideoTime() {
      // Igual a pagina de vendas: revelar o botao quando o VSL chega
      // no ponto da oferta.
      const timer = setInterval(function () {
        const sp = window.smartplayer;
        const instances = sp && sp.instances;
        let t = null;
        if (instances && instances.length) {
          for (let i = 0; i < instances.length; i++) {
            const v = instances[i] && instances[i].video;
            if (v && typeof v.currentTime === "number") { t = v.currentTime; break; }
          }
        }
        if (t === null) {
          const el = document.querySelector("vturb-smartplayer video");
          if (el && typeof el.currentTime === "number") t = el.currentTime;
        }
        if (t !== null && t >= REVEAL_AT_SECONDS) {
          clearInterval(timer);
          revealCta();
        }
      }, 1000);
    }

    if (new URLSearchParams(location.search).has("preview") || REVEAL_AT_SECONDS <= 0) {
      revealCta();
    } else {
      watchVideoTime();
    }
  </script>
